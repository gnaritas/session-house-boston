<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og src — Session House</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(1400px 620px at 38% -140px,rgba(201,155,73,.22),transparent 62%),linear-gradient(160deg,#0e1a11,#1c2f21 62%,#20382a);color:#f1e8d3;font-family:"Iowan Old Style",Palatino,Georgia,serif;padding:74px 84px;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#e8c884;margin-bottom:26px}
  h1{font-size:118px;line-height:.98;letter-spacing:-.02em;font-weight:700}
  h1 em{font-style:italic;color:#c99b49}
  .wave{margin:26px 0 6px;color:#c99b49;display:block;width:230px;height:72px}
  .tagline{font-style:italic;font-size:34px;color:#e8c884;margin-top:20px}
  .chips{display:flex;gap:14px;margin-top:34px}
  .chip{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:.08em;border:1.5px solid rgba(232,200,132,.7);border-radius:999px;padding:11px 20px;color:#f1e8d3}
  .sub{font-family:ui-monospace,Menlo,monospace;font-size:19px;letter-spacing:.12em;color:rgba(241,232,211,.72);margin-top:30px;text-transform:uppercase}
  .harp{position:absolute;right:88px;top:66px;width:170px;height:170px;color:rgba(201,155,73,.75)}
  .rule{border:0;border-top:2px double rgba(201,155,73,.55);margin-top:8px}
</style>
</head>
<body>
  <svg class="harp" viewBox="0 0 24 24" fill="none">
    <path d="M4.5 18.5C4.5 8.8 9.2 5 17.7 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M4.5 18.5h13.2M17.7 5v13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M8.4 18.5V6.2M11.6 18.5V5.35M14.8 18.5V5.05" stroke="currentColor" stroke-width="0.9"/>
  </svg>
  <div>
    <p class="eyebrow">Opening mid-November 2026 &middot; Adams Village, Dorchester</p>
    <h1>Session <em>House</em></h1>
    <svg class="wave" viewBox="0 0 140 44" aria-hidden="true">
      <circle cx="14" cy="22" r="2.6" fill="currentColor"/>
      <path d="M24 10a17 17 0 0 1 0 24M34 4a27 27 0 0 1 0 36M44 -2a37 37 0 0 1 0 48" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
      <path d="M126 10a17 17 0 0 0 0 24M116 4a27 27 0 0 0 0 36M106 -2a37 37 0 0 0 0 48" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    </svg>
    <p class="tagline">Come for the music. Stay for the soul.</p>
    <div class="chips">
      <span class="chip">Trad sessions &middot; 5&ndash;7 nights</span>
      <span class="chip">Elevated pub grub</span>
      <span class="chip">Whiskey &middot; cocktails &middot; wine &middot; beer</span>
    </div>
    <p class="sub">782 Adams St &middot; Boston MA 02124 &middot; info@sessionhouseboston.com</p>
  </div>
  <hr class="rule">
